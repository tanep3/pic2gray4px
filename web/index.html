<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7a8c4" />
    <title>pic2gray4px Web</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">▦</span>
        <h1>pic2gray4px</h1>
      </div>
      <div class="header-tools">
        <label class="lang-label">
          <span data-i18n="language">言語</span>
          <select id="lang-select">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </label>
        <span class="version">v%APP_VERSION%</span>
      </div>
    </header>

    <div id="update-notice" class="update-notice" hidden>
      <span data-i18n="updateAvailable">新しいバージョンがあります</span>
      <button id="update-reload" type="button" data-i18n="reload">再読み込み</button>
    </div>

    <main>
      <section class="input-area">
        <div id="drop-zone" class="drop-zone" role="button" tabindex="0">
          <p class="drop-main" data-i18n="dropHere">ここに画像をドロップ、またはクリックして選択</p>
          <p class="drop-sub" data-i18n="dropSub">写真を 2×2 セルの白黒パターンに変換します</p>
          <p class="drop-release" data-i18n="dropRelease">はなして読み込む</p>
        </div>
        <input id="file-input" type="file" accept="image/*" hidden />
        <div id="paste-box" class="paste-box" contenteditable="true" data-i18n-placeholder="paste"></div>
      </section>

      <section class="size-area">
        <h2 data-i18n="sizeTitle">出力の幅</h2>
        <div id="size-chips" class="chips">
          <button type="button" class="chip" data-size="original" aria-pressed="false" data-i18n="sizeOriginal">原画</button>
          <button type="button" class="chip" data-size="384" aria-pressed="false">384 (T02等)</button>
          <button type="button" class="chip" data-size="576" aria-pressed="true">576 (M02S等)</button>
          <button type="button" class="chip" data-size="250" aria-pressed="false">250 (E-ink)</button>
          <button type="button" class="chip" data-size="custom" aria-pressed="false" data-i18n="sizeCustom">カスタム</button>
        </div>
        <label id="custom-width-row" class="custom-width" hidden>
          <span data-i18n="customWidth">幅 (px)</span>
          <input id="custom-width" type="number" min="1" max="100000" step="1" value="384" />
        </label>
      </section>

      <section class="adjust-area">
        <h2 data-i18n="modeTitle">モード</h2>
        <div class="adjust-row">
          <div id="mode-chips" class="chips">
            <button type="button" class="chip" data-mode="dither" aria-pressed="false" data-i18n="modeDither">ディザ</button>
            <button type="button" class="chip" data-mode="photo" aria-pressed="true" data-i18n="modePhoto">写真</button>
            <button type="button" class="chip" data-mode="illustration" aria-pressed="false" data-i18n="modeIllustration">イラスト</button>
          </div>
        </div>
      </section>

      <section class="adjust-area">
        <h2 data-i18n="adjustTitle">色調整</h2>
        <div class="adjust-row">
          <span class="adjust-label" data-i18n="mixerTitle">ミキサー</span>
          <div id="mixer-chips" class="chips">
            <button type="button" class="chip" data-mixer="standard" aria-pressed="false" data-i18n="mixerStandard">標準</button>
            <button type="button" class="chip" data-mixer="warm" aria-pressed="true" data-i18n="mixerWarm">赤寄り</button>
            <button type="button" class="chip" data-mixer="green" aria-pressed="false" data-i18n="mixerGreen">緑寄り</button>
          </div>
        </div>
        <div class="adjust-row">
          <span class="adjust-label" data-i18n="curveTitle">トーンカーブ</span>
          <div id="curve-chips" class="chips">
            <button type="button" class="chip" data-curve="normal" aria-pressed="false" data-i18n="curveNormal">ノーマル</button>
            <button type="button" class="chip" data-curve="contrast" aria-pressed="true" data-i18n="curveContrast">明暗強調</button>
          </div>
        </div>
      </section>

      <section class="previews">
        <figure class="preview-card">
          <figcaption data-i18n="sourceTitle">原画</figcaption>
          <div class="preview-frame">
            <div id="crop-wrap" class="crop-wrap">
              <img id="source-img" alt="" hidden />
              <div id="crop-overlay" class="crop-overlay" hidden>
                <div id="crop-rect" class="crop-rect">
                  <span class="crop-handle" data-handle="nw"></span>
                  <span class="crop-handle" data-handle="ne"></span>
                  <span class="crop-handle" data-handle="sw"></span>
                  <span class="crop-handle" data-handle="se"></span>
                </div>
              </div>
            </div>
            <p id="source-empty" class="empty-note" data-i18n="noImage">画像がありません</p>
          </div>
          <div class="crop-bar">
            <button id="crop-start" type="button" class="ghost" hidden data-i18n="crop">切り抜き</button>
            <button id="crop-apply" type="button" hidden data-i18n="cropApply">適用</button>
            <button id="crop-cancel" type="button" class="ghost" hidden data-i18n="cropCancel">やめる</button>
            <button id="crop-reset" type="button" class="ghost" hidden data-i18n="cropReset">切り抜き解除</button>
          </div>
          <p id="source-meta" class="meta"></p>
        </figure>
        <figure class="preview-card">
          <figcaption data-i18n="resultTitle">変換結果</figcaption>
          <div class="preview-frame">
            <img id="result-img" class="pixelated" alt="" hidden />
            <p id="result-empty" class="empty-note" data-i18n="noResult">まだ変換していません</p>
          </div>
          <p id="result-meta" class="meta"></p>
        </figure>
      </section>

      <p id="status-line" class="status" role="status"></p>

      <section class="actions">
        <div class="action-buttons">
          <button id="share-button" type="button" disabled data-i18n="share">共有</button>
          <button id="save-button" type="button" class="ghost" disabled data-i18n="save">PNG を保存</button>
          <button id="print-button" type="button" class="ghost" disabled data-i18n="print">印刷</button>
        </div>
      </section>

      <details class="advanced">
        <summary data-i18n="advanced">上級者設定</summary>
        <div class="advanced-grid">
          <label>
            <span data-i18n="contrast">コントラスト</span>
            <select id="contrast-mode">
              <option value="auto" data-i18n="auto">自動</option>
              <option value="off" data-i18n="off">オフ</option>
              <option value="manual" data-i18n="manual">手動</option>
            </select>
            <input id="contrast-range" type="range" min="0" max="3" step="0.01" value="1" disabled />
            <span id="contrast-value" class="range-value"></span>
          </label>
          <label>
            <span data-i18n="unsharp">シャープネス</span>
            <select id="unsharp-mode">
              <option value="auto" data-i18n="auto">自動</option>
              <option value="off" data-i18n="off">オフ</option>
              <option value="manual" data-i18n="manual">手動</option>
            </select>
            <input id="unsharp-range" type="range" min="0" max="2" step="0.01" value="0" disabled />
            <span id="unsharp-value" class="range-value"></span>
          </label>
          <label>
            <span data-i18n="passes">最適化パス</span>
            <input id="passes-range" type="range" min="0" max="10" step="1" value="10" />
            <span id="passes-value" class="range-value"></span>
          </label>
          <label>
            <span data-i18n="localStrength">局所コントラストの強さ</span>
            <input id="local-range" type="range" min="0" max="1" step="0.05" value="0" />
            <span id="local-value" class="range-value"></span>
          </label>
        </div>
      </details>
    </main>

    <footer class="credit">© Tane Channel Technology</footer>

    <div id="print-sheet" aria-hidden="true">
      <img id="print-img" alt="" />
    </div>

    <div id="zoom-modal" class="zoom-modal" hidden role="dialog" aria-modal="true" data-i18n-aria="zoomTitle">
      <img id="zoom-img" class="pixelated" alt="" />
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
