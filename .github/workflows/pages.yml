name: Pages

# Releases are tag-driven: pushing a v* tag builds that tag's commit and
# publishes it to GitHub Pages. The tag is the version source of truth;
# web/package.json's appVersion must equal the tag without the 'v'
# (bump it BEFORE tagging). Manual runs from the Actions tab are for
# trying the pipeline without a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Release gate: the site is only published when the library tests
      # pass (default features = the CLI build, plus the decoder-free
      # library build that the WASM crate depends on).
      - name: Test the library
        run: |
          cargo test
          cargo test --lib --no-default-features

      - name: Build the WASM core into the web app
        run: >
          wasm-pack build wasm --target web
          --out-dir "$GITHUB_WORKSPACE/web/public/wasm"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web app
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
